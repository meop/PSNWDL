---
name: Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.25.x'
  NFPM_VERSION: 'v2.47.0'
  NODE_VERSION: '26.3.1'
  PNPM_VERSION: '11.18.0'
  WAILS_VERSION: 'v3.0.0-alpha2.121'

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for version tag
        id: check
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Target version: $VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release steps."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VERSION does not exist. Triggering release pipeline."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [[ "$VERSION" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify generated version metadata
        shell: pwsh
        run: ./scripts/Sync-Version.ps1
      - name: Verify Go formatting
        shell: bash
        run: |
          UNFORMATTED=$(find . -name '*.go' -not -path './frontend/*' -print0 | xargs -0 gofmt -l)
          if [[ -n "$UNFORMATTED" ]]; then
            echo "$UNFORMATTED"
            exit 1
          fi
      - name: Generate Wails bindings
        run: wails3 generate bindings -clean=true -ts
      - name: Build and check frontend
        working-directory: frontend
        run: |
          pnpm run build
          pnpm run check
      - name: Build and vet Go code
        run: |
          go build ./...
          go vet ./...
      - name: Run Go tests with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Build Wails application
        run: wails3 build
      - name: Verify generated files are committed
        shell: bash
        run: git diff --exit-code

  build:
    name: Build ${{ matrix.name }}
    needs: [version, validate]
    if: github.ref == 'refs/heads/master' && needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            os: windows
            arch: amd64
          - name: Windows ARM64
            runner: windows-11-arm
            os: windows
            arch: arm64
          - name: Linux x64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            os: darwin
            arch: amd64
          - name: macOS Apple Silicon
            runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install NSIS
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $nsisPath 'makensis.exe'))) {
            throw "makensis.exe was not installed in $nsisPath"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Synchronize version metadata
        shell: pwsh
        run: ./scripts/Sync-Version.ps1
      - name: Build Windows packages
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          wails3 task windows:create:nsis:installer ARCH=${{ matrix.arch }} INSTALL_SCOPE=user
          New-Item -ItemType Directory -Force staging | Out-Null
          $version = (Get-Content VERSION -Raw).Trim()
          $installer = Get-Item "bin/PSNWDL-${{ matrix.arch }}-installer.exe"
          Copy-Item $installer.FullName "staging/PSNWDL-$version-windows-${{ matrix.arch }}-installer.exe"
          Compress-Archive -Path bin/PSNWDL.exe, LICENSE -DestinationPath "staging/PSNWDL-$version-windows-${{ matrix.arch }}-portable.zip"
      - name: Build Linux packages
        if: matrix.os == 'linux'
        shell: bash
        run: |
          wails3 task linux:package ARCH=${{ matrix.arch }}
          mkdir -p staging
          version=$(tr -d '[:space:]' < VERSION)
          shopt -s nullglob
          debs=(bin/*.deb)
          rpms=(bin/*.rpm)
          arch_packages=(bin/*.pkg.tar.zst)
          if (( ${#debs[@]} != 1 || ${#rpms[@]} != 1 || ${#arch_packages[@]} != 1 )); then
            echo "Expected one DEB, RPM, and Arch package; found ${#debs[@]} DEB, ${#rpms[@]} RPM, and ${#arch_packages[@]} Arch files" >&2
            exit 1
          fi
          mv "${debs[0]}" "staging/PSNWDL-$version-linux-${{ matrix.arch }}.deb"
          mv "${rpms[0]}" "staging/PSNWDL-$version-linux-${{ matrix.arch }}.rpm"
          mv "${arch_packages[0]}" "staging/PSNWDL-$version-linux-${{ matrix.arch }}.pkg.tar.zst"

          archive_root="archive/PSNWDL-$version"
          mkdir -p "$archive_root"
          cp bin/PSNWDL "$archive_root/PSNWDL"
          cp build/linux/PSNWDL.desktop "$archive_root/PSNWDL.desktop"
          cp build/appicon.png "$archive_root/PSNWDL.png"
          cp LICENSE "$archive_root/LICENSE"
          tar -C archive -czf "staging/PSNWDL-$version-linux-${{ matrix.arch }}-portable.tar.gz" "PSNWDL-$version"

          docker build \
            --build-arg NFPM_VERSION='${{ env.NFPM_VERSION }}' \
            --build-arg PNPM_VERSION='${{ env.PNPM_VERSION }}' \
            --build-arg TARGETARCH='${{ matrix.arch }}' \
            --build-arg WAILS_VERSION='${{ env.WAILS_VERSION }}' \
            --file build/linux/alpine/Dockerfile \
            --output type=local,dest=alpine-package \
            .
          apks=(alpine-package/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected one Alpine APK, found ${#apks[@]}" >&2
            exit 1
          fi
          mv "${apks[0]}" "staging/PSNWDL-$version-linux-${{ matrix.arch }}.apk"
      - name: Build macOS packages
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          wails3 task darwin:package:dmg ARCH=${{ matrix.arch }}
          mkdir -p staging
          version=$(tr -d '[:space:]' < VERSION)
          mv bin/PSNWDL.dmg "staging/PSNWDL-$version-macos-${{ matrix.arch }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            bin/PSNWDL.app \
            "staging/PSNWDL-$version-macos-${{ matrix.arch }}-portable.zip"
      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PSNWDL-${{ matrix.os }}-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    if: github.ref == 'refs/heads/master' && needs.version.outputs.changed == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download package artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true
      - name: Create signed tag
        run: |
          git tag -s v${{ needs.version.outputs.new_version }} -m "Release v${{ needs.version.outputs.new_version }}"
          git push origin v${{ needs.version.outputs.new_version }}
      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          commitMode: true
          configuration: |
            {
              "commit_template": "- #{{SUMMARY}} ([#{{SHA}}](https://github.com/${{ github.repository }}/commit/#{{SHA}}))"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate AUR package recipe
        shell: pwsh
        run: |
          ./scripts/New-AURSourcePackage.ps1 `
            -ArtifactsDirectory artifacts `
            -Version '${{ needs.version.outputs.new_version }}'
      - name: Generate and sign checksums
        working-directory: artifacts
        run: |
          LC_ALL=C sha256sum -- * > sha256sums.txt
          gpg --batch --yes \
            --local-user '${{ steps.import_gpg.outputs.fingerprint }}' \
            --output sha256sums.txt.sig \
            --detach-sign sha256sums.txt
          gpg --batch --verify sha256sums.txt.sig sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.new_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: artifacts/*
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
